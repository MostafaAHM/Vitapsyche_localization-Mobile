name: flutter_mindmed_project
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# Versioning
version: 1.0.0+1

# Dart and Flutter SDK environment
environment:
  sdk: '>=3.4.1 <4.0.0'

# Dependencies
dependencies:
  animated_splash_screen: ^1.3.0
  country_flags: ^3.2.0
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.6
  flutter_localizations:
        sdk: flutter 
  file_picker: ^8.3.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_email_sender: ^6.0.3
  flutter_local_notifications: ^18.0.1
  flutter_screenutil: ^5.9.3
  flutter_tts: ^4.2.0
  fluttertoast: ^8.2.8
  google_fonts: ^5.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  just_audio: ^0.9.46
  model_viewer_plus: ^1.9.1
  page_transition: ^2.0.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.0.0
  speech_to_text: ^7.0.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Material Icons
  uses-material-design: true

  # Assets
  assets:
    - assets/animation/
    - assets/articles/
    - assets/images/
    - assets/json/
    - assets/LinaModel/
    - assets/json/test/free_tests/
    - assets/json/test/paid_tests/
    - assets/products/Buddha/
    - assets/products/dotJournaling/
    - assets/products/giftBasket/
    - assets/products/headMassage/
    - assets/products/headphone/
    - assets/products/herbalMoodSleep/
    - assets/products/lightBulb/
    - assets/products/massageSeat/
    - assets/products/pressureBall/
    - assets/products/Punch/
    - assets/products/reliefCube/
    - assets/payment/
    - assets/entertainment/audio/
    - assets/entertainment/images/
flutter_intl:
  enabled: true

